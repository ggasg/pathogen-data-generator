[project]
name = "pathogen-data-generator"
version = "0.1.0"
description = "Synthetic pathogen telemetry and touch event generator"
readme = "README.md"
authors = [
    { name = "Gaston GG", email = "gaston.guitart@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "confluent-kafka[json,schema-registry]>=2.3.0",
    "faker>=24.0.0",
]

[project.scripts]
pathogen-data-generator = "pathogen_data_generator:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]